<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-label="Staged Spark batch pipeline from raw JSON to a star schema in under 250 seconds.">
  <style>
    .t{font:600 12px ui-monospace,Menlo,monospace;fill:#3C4354;letter-spacing:.06em}
    .s{font:400 10px ui-monospace,Menlo,monospace;fill:#8892A6}
    .k{font:500 10px ui-monospace,Menlo,monospace;fill:#8892A6;letter-spacing:.16em}
    .b{fill:#2456D6;fill-opacity:.05;stroke:#2456D6;stroke-opacity:.4;stroke-width:1.4}
    .b2{fill:#1F7A5A;fill-opacity:.07;stroke:#1F7A5A;stroke-opacity:.5;stroke-width:1.4}
    .w{stroke:#8892A6;stroke-opacity:.5;stroke-width:1.3;fill:none}
    .p{fill:#2456D6}
    .badge{fill:#2456D6}
    .bt{font:700 12px ui-monospace,Menlo,monospace;fill:#fff}
    .big{font:700 15px 'Segoe UI',Helvetica,sans-serif;fill:#2456D6}
  </style>
  <text class="k" x="28" y="26">STAGED BATCH &#183; EACH STEP RE-RUNNABLE ON ITS OWN</text>

  <g transform="translate(28,44)">
    <rect class="b" x="0" y="0" width="124" height="56" rx="10"/>
    <text class="t" x="62" y="24" text-anchor="middle">RAW JSON</text>
    <text class="s" x="62" y="40" text-anchor="middle">nested &#183; 10M rows</text>

    <rect class="b" x="156" y="0" width="112" height="56" rx="10"/>
    <text class="t" x="212" y="24" text-anchor="middle">INGEST</text>
    <text class="s" x="212" y="40" text-anchor="middle">read</text>

    <rect class="b" x="272" y="0" width="112" height="56" rx="10"/>
    <text class="t" x="328" y="24" text-anchor="middle">FLATTEN</text>
    <text class="s" x="328" y="40" text-anchor="middle">explode arrays</text>

    <rect class="b" x="388" y="0" width="112" height="56" rx="10"/>
    <text class="t" x="444" y="24" text-anchor="middle">CLEAN</text>
    <text class="s" x="444" y="40" text-anchor="middle">types &#183; nulls</text>

    <rect class="b" x="504" y="0" width="124" height="56" rx="10"/>
    <text class="t" x="566" y="24" text-anchor="middle">AGGREGATE</text>
    <text class="s" x="566" y="40" text-anchor="middle">per contract</text>

    <rect class="b2" x="648" y="0" width="124" height="56" rx="10"/>
    <text class="t" x="710" y="24" text-anchor="middle">STAR SCHEMA</text>
    <text class="s" x="710" y="40" text-anchor="middle">1M OLAP rows</text>

    <rect class="b2" x="792" y="0" width="110" height="56" rx="10"/>
    <text class="t" x="847" y="24" text-anchor="middle">BI</text>
    <text class="s" x="847" y="40" text-anchor="middle">no transform</text>

    <path class="w" d="M124 28 H156 M268 28 H272 M384 28 H388 M500 28 H504 M628 28 H648 M772 28 H792"/>
    <circle class="p" r="3.4"><animateMotion dur="4s" repeatCount="indefinite" path="M124 28 H156 M268 28 H272 M384 28 H388 M500 28 H504 M628 28 H648 M772 28 H792"/></circle>
    <circle class="p" r="3.4" opacity=".55"><animateMotion dur="4s" begin="-2s" repeatCount="indefinite" path="M124 28 H156 M268 28 H272 M384 28 H388 M500 28 H504 M628 28 H648 M772 28 H792"/></circle>
  </g>

  <g transform="translate(28,124)">
    <rect class="badge" x="0" y="0" width="150" height="26" rx="13"/>
    <text class="bt" x="75" y="18" text-anchor="middle">UNDER 250 SECONDS</text>
    <text class="big" x="170" y="18">10M &#8594; 1M rows</text>
    <text class="s" x="330" y="18">per run, inside the reporting window every time</text>
  </g>
  <text class="s" x="28" y="176">PySpark benchmarked against Java Spark task by task &#8212; engine choice is a measurement, not a preference.</text>
</svg>
